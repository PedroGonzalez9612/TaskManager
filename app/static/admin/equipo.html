<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Equipo — GestLab</title>
    <link rel="stylesheet" href="/static/vendor/event-calendar/event-calendar.min.css">
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="cargando">
    <main class="principal">
        <div class="encabezado-pagina">
            <div>
                <h1>Equipo</h1>
                <p id="resumen" class="cifra" aria-live="polite"></p>
            </div>
            <button type="button" id="nueva-actividad" class="boton">Nueva actividad</button>
        </div>

        <section class="panel panel-horario" aria-label="Horario del día por operario">
            <output id="aviso-sobrecarga" class="nota-panel" hidden></output>
            <!-- Proximidad: el significado de los colores y el control que los cambia van juntos, con el horario. -->
            <div class="barra-horario">
                <div id="leyenda" class="leyenda" aria-label="Significado de los colores"></div>
                <div id="controles"></div>
            </div>
            <div class="panel-calendario">
                <div id="calendario"></div>
            </div>
        </section>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/vendor/lucide/iconos.js"></script>
    <script src="/static/js/layout.js"></script>
    <script src="/static/js/componentes.js"></script>
    <script src="/static/js/actividades-comun.js"></script>
    <script src="/static/js/formulario-actividad.js"></script>
    <script src="/static/vendor/event-calendar/event-calendar.min.js"></script>
    <script src="/static/admin/equipo.js"></script>
</body>
</html>
