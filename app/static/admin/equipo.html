<!DOCTYPE html>
<html lang="es">

<body class="cargando">

        <div class="encabezado-pagina">
            <div>
                <h1>Equipo</h1>

            <div class="grupo-controles">
                <div id="controles"></div>
                <button type="button" id="nueva-actividad" class="boton">+ Nueva actividad</button>

        <section class="panel panel-calendario">
            <div id="calendario"></div>
        </section>
        <div id="leyenda" class="leyenda" aria-label="Significado de los colores"></div>

    <script src="/static/vendor/lucide/iconos.js"></script>

    <script src="/static/js/actividades-comun.js"></script>
