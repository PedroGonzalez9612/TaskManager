<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Actividades — GestLab</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="cargando">
    <main class="principal">
        <div class="encabezado-pagina">
            <div>
                <h1>Actividades</h1>
                <p id="resumen" class="cifra" aria-live="polite"></p>
            </div>
            <button type="button" id="nueva-actividad" class="boton">Nueva actividad</button>
        </div>

        <div class="maestro-detalle">
            <section class="panel" aria-labelledby="titulo-requerimientos">
                <div class="panel-encabezado">
                    <h2 id="titulo-requerimientos">Requerimientos</h2>
                    <button type="button" class="boton-texto" data-abrir-requerimiento>Nuevo</button>
                </div>
                <div id="lista-requerimientos" class="lista-requerimientos"></div>
            </section>

            <section class="panel" aria-live="polite">
                <div class="panel-encabezado">
                    <div>
                        <h2 id="titulo-requerimiento" class="titulo-con-cantidad">Todas las actividades</h2>
                        <p id="descripcion-requerimiento" class="texto-suave" hidden></p>
                    </div>
                    <button type="button" id="eliminar-requerimiento" class="boton-texto peligro" hidden>Eliminar requerimiento</button>
                </div>
                <div id="encabezado-lista" class="encabezado-lista" aria-hidden="true" hidden>
                    <span>Actividad</span><span>Prioridad</span><span>Programada</span><span>Operarios</span><span>Estado</span>
                </div>
                <ul id="lista-actividades" class="lista-filas" hidden></ul>
                <div id="sin-actividades" class="estado-vacio" hidden>
                    <strong id="sin-actividades-titulo">Sin actividades</strong>
                    <span id="sin-actividades-texto">Crea una actividad y asígnala a uno o varios operarios.</span>
                </div>
            </section>
        </div>
    </main>

    <dialog id="dialogo-requerimiento" class="dialogo" aria-labelledby="titulo-dialogo-requerimiento">
        <div class="dialogo-encabezado">
            <h2 id="titulo-dialogo-requerimiento">Nuevo requerimiento</h2>
            <button type="button" class="boton-cerrar" data-cerrar aria-label="Cerrar">&times;</button>
        </div>
        <form class="formulario" novalidate>
            <label for="req-titulo">Título</label>
            <input id="req-titulo" name="titulo" maxlength="120" required>

            <label for="req-descripcion">Descripción <span class="cantidad">(opcional)</span></label>
            <textarea id="req-descripcion" name="descripcion" rows="3"></textarea>
            <p class="ayuda-campo">Quién lo pidió, para qué y cualquier dato que ayude a planearlo.</p>

            <p class="mensaje-formulario" role="alert" hidden></p>
            <div class="dialogo-acciones">
                <button type="button" class="boton-secundario" data-cerrar>Cancelar</button>
                <button type="submit" class="boton">Registrar requerimiento</button>
            </div>
        </form>
    </dialog>

    <script src="/static/js/api.js"></script>
    <script src="/static/vendor/lucide/iconos.js"></script>
    <script src="/static/js/layout.js"></script>
    <script src="/static/js/actividades-comun.js"></script>
    <script src="/static/js/formulario-actividad.js"></script>
    <script src="/static/admin/actividades.js"></script>
</body>
</html>
