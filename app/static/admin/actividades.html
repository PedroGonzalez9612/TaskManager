<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Planeación — GestLab</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="cargando">
    <!-- Planeación del Administrador (alcance, Sección 6.2): el trabajo de cualquier día. Pestañas: las
         actividades y los proyectos (la carga de la semana se agrega después). El detalle se abre en el
         panel lateral. -->
    <main class="principal">
        <div class="encabezado-pagina">
            <div>
                <h1>Planeación</h1>
                <p id="resumen" class="cifra texto-secundario" aria-live="polite"></p>
            </div>
            <button type="button" id="accion-principal" class="boton">Nueva actividad</button>
        </div>

        <div class="pestanas" role="tablist" aria-label="Planeación">
            <button type="button" role="tab" id="pestana-actividades" aria-controls="vista-actividades" data-vista="actividades">Actividades</button>
            <button type="button" role="tab" id="pestana-proyectos" aria-controls="vista-proyectos" data-vista="proyectos">Proyectos</button>
        </div>

        <section id="vista-actividades" role="tabpanel" aria-labelledby="pestana-actividades" class="vista-pestana">
            <div id="lista-filtros" class="filtros-linea" role="group" aria-label="Mostrar actividades"></div>
            <ul id="lista-actividades" class="lista-admin" aria-live="polite" hidden></ul>
            <div id="sin-actividades" class="estado-vacio" hidden>
                <strong id="sin-actividades-titulo">Sin actividades</strong>
                <span id="sin-actividades-texto">Crea una actividad y asígnala a uno o varios operarios.</span>
            </div>
        </section>

        <section id="vista-proyectos" role="tabpanel" aria-labelledby="pestana-proyectos" class="vista-pestana" hidden>
            <ul id="lista-proyectos" class="lista-admin" hidden></ul>
            <div id="sin-proyectos" class="estado-vacio" hidden>
                <strong>Todavía no hay proyectos</strong>
                <span>Un proyecto agrupa actividades con un mismo objetivo. Crea uno con "Nuevo proyecto".</span>
            </div>
        </section>

    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/vendor/lucide/iconos.js"></script>
    <script src="/static/js/layout.js"></script>
    <script src="/static/js/actividades-comun.js"></script>
    <script src="/static/js/formulario-actividad.js"></script>
    <script src="/static/admin/actividades.js"></script>
</body>
</html>
