<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Actividades — GestLab</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="cargando">
    <main class="principal">
        <div class="encabezado-pagina">
            <div>
                <h1>Actividades</h1>
                <p id="resumen" class="cifra" aria-live="polite"></p>
            </div>
            <button type="button" id="nueva-actividad" class="boton">Nueva actividad</button>
        </div>

        <div class="maestro-detalle">
            <!-- Los filtros son de apoyo: van sobre el fondo, sin panel (alcance, Sección 6.2). -->
            <nav class="seccion-apoyo filtros" aria-labelledby="titulo-filtros">
                <h2 id="titulo-filtros">Mostrar actividades</h2>
                <div id="lista-filtros" class="lista-filtros"></div>
            </nav>

            <section class="panel" aria-live="polite">
                <div class="panel-encabezado">
                    <h2 id="titulo-lista" class="titulo-con-cantidad">Por hacer</h2>
                </div>
                <div id="encabezado-lista" class="encabezado-lista" aria-hidden="true" hidden>
                    <span>Actividad</span><span>Prioridad</span><span>Hora</span><span>Operarios</span><span>Estado</span>
                </div>
                <ul id="lista-actividades" class="lista-filas" hidden></ul>
                <div id="sin-actividades" class="estado-vacio" hidden>
                    <strong id="sin-actividades-titulo">Sin actividades</strong>
                    <span id="sin-actividades-texto">Crea una actividad y asígnala a uno o varios operarios.</span>
                </div>
            </section>
        </div>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/vendor/lucide/iconos.js"></script>
    <script src="/static/js/layout.js"></script>
    <script src="/static/js/actividades-comun.js"></script>
    <script src="/static/js/formulario-actividad.js"></script>
    <script src="/static/admin/actividades.js"></script>
</body>
</html>
