<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Resumen — GestLab</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="cargando ancho-angosto">
    <!-- Resumen del Operario (alcance, Secciones 5.2 y 6.1): cómo le fue en la semana, escrito como
         frases y sin rankings. Los datos salen de GET /analisis/indicadores, que solo le da los suyos. -->
    <main class="principal resumen">
        <header class="resumen-encabezado">
            <div>
                <h1>Tu semana</h1>
                <p id="rango-semana" class="texto-secundario"></p>
            </div>
            <fieldset class="grupo-botones">
                <legend class="solo-lectores">Cambiar de semana</legend>
                <button type="button" id="semana-anterior" class="boton-secundario boton-pequeno" aria-label="Semana anterior"></button>
                <button type="button" id="semana-actual" class="boton-secundario boton-pequeno">Esta semana</button>
                <button type="button" id="semana-siguiente" class="boton-secundario boton-pequeno" aria-label="Semana siguiente"></button>
            </fieldset>
        </header>

        <p id="mensaje" class="estado-vacio" aria-live="polite">Cargando tu semana…</p>
        <section id="resumen-frases" class="resumen-frases" aria-label="Cómo te fue" aria-live="polite" hidden></section>
        <section id="resumen-asistencia" class="resumen-seccion" aria-labelledby="titulo-asistencia" hidden></section>
        <section id="resumen-tiempos" class="resumen-seccion" aria-labelledby="titulo-tiempos" hidden></section>
        <section id="resumen-pausas" class="resumen-seccion" aria-labelledby="titulo-pausas" hidden></section>
        <section id="resumen-viene" class="resumen-seccion" aria-labelledby="titulo-viene" hidden></section>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/vendor/lucide/iconos.js"></script>
    <script src="/static/js/layout.js"></script>
    <script src="/static/operario/resumen.js"></script>
</body>
</html>
