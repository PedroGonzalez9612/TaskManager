<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Inicio — GestLab</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="cargando ancho-angosto">
    <!-- Inicio: lo primero que ve el Operario después de iniciar sesión (alcance, Sección 6.1).
         Responde "¿qué hago ahora?": su turno, la actividad en curso o lo que sigue, y una sola
         acción principal. Las barras del turno y de la jornada están en Hoy. -->
    <main class="principal inicio">
        <header class="inicio-encabezado">
            <p id="fecha-inicio" class="inicio-fecha cifra"></p>
            <h1 id="saludo">Hola</h1>
            <div id="inicio-turno" class="inicio-turno" aria-live="polite"></div>
        </header>
        <p id="mensaje" class="estado-vacio" aria-live="polite">Cargando tu jornada…</p>
        <section id="inicio-ahora" class="inicio-ahora" hidden></section>
        <div id="inicio-acciones" class="inicio-acciones" hidden></div>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/vendor/lucide/iconos.js"></script>
    <script src="/static/js/layout.js"></script>
    <script src="/static/js/actividades-comun.js"></script>
    <script src="/static/operario/operario-comun.js"></script>
    <script src="/static/operario/inicio.js"></script>
</body>
</html>
