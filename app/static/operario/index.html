<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Hoy — GestLab</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="cargando ancho-angosto">
    <main class="principal">
        <header class="turno-encabezado">
            <p class="turno-fecha"><span id="fecha-hoy"></span> <span id="turno-estado" class="turno-estado" hidden></span></p>
            <h1 id="saludo">Tu turno</h1>
            <p id="turno-resumen" class="turno-resumen cifra" aria-live="polite"></p>
            <output id="aviso-turno" class="aviso aviso-info" hidden></output>
            <div id="turno-acciones" class="turno-acciones" hidden>
                <button type="button" id="ordenar-dia" class="boton-secundario" hidden></button>
                <button type="button" id="marcar-salida" class="boton-secundario"></button>
            </div>
            <output id="turno-sobrecarga" class="aviso aviso-advertencia" hidden><span>El trabajo programado supera la capacidad de tu jornada. Infórmalo a tu administrador.</span></output>
        </header>

        <!-- Inicio y cierre de la jornada: lo que se ve antes de marcar la entrada y después de marcar la salida. -->
        <section id="portada-jornada" class="panel portada-jornada" hidden></section>

        <p id="mensaje" class="estado-vacio" aria-live="polite">Cargando actividades…</p>
        <!-- Su fila del tablero del turno, en vertical: un punto de la línea de tiempo por actividad, en orden. -->
        <ol id="linea-tiempo" class="linea-tiempo" aria-label="Programación del día" hidden></ol>
        <!-- Modo para ordenar el día: solo las actividades de horario flexible. -->
        <section id="ordenador" class="panel ordenador" aria-labelledby="titulo-ordenador" hidden></section>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/vendor/lucide/iconos.js"></script>
    <script src="/static/js/layout.js"></script>
    <script src="/static/js/actividades-comun.js"></script>
    <script src="/static/operario/operario-comun.js"></script>
    <script src="/static/operario/hoy.js"></script>
</body>
</html>
