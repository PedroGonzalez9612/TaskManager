<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Hoy — GestLab</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="cargando ancho-angosto">
    <main class="principal dia">
        <!-- Encabezado: la carga y el tiempo disponible en una frase y una barra, y el horario del
             turno (alcance, Sección 6.1). No repite el saludo, que está en Inicio. -->
        <header class="dia-encabezado">
            <p id="fecha-hoy" class="dia-fecha"></p>
            <h1>Tu día</h1>
            <div id="dia-carga" class="dia-carga"></div>
            <div id="dia-avisos" class="dia-avisos" aria-live="polite"></div>
        </header>

        <p id="mensaje" class="estado-vacio" aria-live="polite">Cargando actividades…</p>
        <!-- Su renglón del tablero del turno, en vertical: una fila por actividad, en orden. Solo se
             lee: cada fila abre el detalle, que es donde se ejecuta. -->
        <ol id="linea-tiempo" class="dia-linea" aria-label="Programación del día" hidden></ol>
        <!-- Modo para ordenar el día: solo las actividades de horario flexible. -->
        <section id="ordenador" class="panel ordenador" aria-labelledby="titulo-ordenador" hidden></section>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/vendor/lucide/iconos.js"></script>
    <script src="/static/js/layout.js"></script>
    <script src="/static/js/actividades-comun.js"></script>
    <script src="/static/operario/operario-comun.js"></script>
    <script src="/static/operario/hoy.js"></script>
</body>
</html>
