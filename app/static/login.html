<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
    <title>Iniciar sesión — GestLab</title>
    <link rel="stylesheet" href="/static/css/estilos.css">
</head>
<body class="pagina-login">
    <main class="tarjeta-login">
        <div class="marca"><img class="marca-icono" src="/static/favicon.svg" alt="">GestLab</div>
        <h1>Inicia sesión</h1>
        <p class="subtitulo">Gestión y análisis de la carga laboral</p>

        <form id="formulario-login" class="formulario" novalidate>
            <label for="correo">Correo</label>
            <input id="correo" name="correo" type="email" autocomplete="username" required>

            <label for="contraseña">Contraseña</label>
            <input id="contraseña" name="contraseña" type="password" autocomplete="current-password" required>

            <p id="mensaje" class="mensaje-formulario" role="alert" hidden></p>
            <button type="submit" class="boton boton-bloque">Ingresar</button>
        </form>
    </main>

    <script src="/static/js/api.js"></script>
    <script src="/static/js/login.js"></script>
</body>
</html>
