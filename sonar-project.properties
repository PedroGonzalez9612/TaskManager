# Análisis de SonarQube. El token NO va aquí: se lee de la variable SONAR_TOKEN (está en el .env).
# Cómo ejecutarlo: ver "Herramientas de desarrollo" en CLAUDE.md.
sonar.projectKey=GestLab
sonar.projectName=GestLab
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

sonar.sources=app,herramientas,Dockerfile
sonar.tests=tests
# Bibliotecas de terceros copiadas en el proyecto: no son código nuestro.
sonar.exclusions=app/static/vendor/**,herramientas/capturas/**

# Cobertura: sale de las pruebas de Python (python -m pytest --cov=app --cov-report=xml).
sonar.python.coverage.reportPaths=coverage.xml
# La interfaz (HTML, CSS y JavaScript) se verifica en el navegador con capturas, no con pruebas
# automáticas; las herramientas de desarrollo y el arranque tampoco tienen pruebas. No se cuentan
# en la cobertura para que el porcentaje hable solo del código que sí se prueba.
sonar.coverage.exclusions=app/static/**,herramientas/**,run.py
